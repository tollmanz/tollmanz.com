name: Deploy to GitHub Pages

# Builds the Eleventy site and publishes it to GitHub Pages, which Fastly fronts
# as the CDN and TLS terminator. Runs on push to main and on manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

# Minimum permissions the official Pages deployment flow requires:
# contents:read for checkout, pages:write to publish, id-token:write for the
# OIDC token deploy-pages uses to prove the deployment's origin.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments. cancel-in-progress is false so an in-flight
# deploy is allowed to finish rather than be left half-applied by a newer run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Fastly caches the whole site, so freshly published content stays hidden
      # behind stale edge copies until their TTL expires. A purge_all after the
      # deploy clears every object at once; the next request for each URL misses
      # and re-fetches from GitHub Pages. The site is static and fully
      # regenerated on each deploy, so purging everything is safe. The token is
      # scoped to purge_all only (separate from the Pulumi write token), and the
      # non-secret service ID comes from an Actions variable.
      - name: Purge Fastly cache
        env:
          FASTLY_PURGE_TOKEN: ${{ secrets.FASTLY_PURGE_TOKEN }}
          FASTLY_SERVICE_ID: ${{ vars.FASTLY_SERVICE_ID }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Fastly-Key: ${FASTLY_PURGE_TOKEN}" \
            --header "Accept: application/json" \
            "https://api.fastly.com/service/${FASTLY_SERVICE_ID}/purge_all"
