name: Deploy to GitHub Pages

# Builds the Eleventy site and publishes it to GitHub Pages, which Fastly fronts
# as the CDN and TLS terminator. Runs on push to main and on manual dispatch.

on:
  push:
    branches: [main]
    # Skip the deploy (and the Fastly full purge) for pushes that cannot
    # affect the built site: infra deploys through its own workflows, and
    # tests, docs, and local tooling never reach public/.
    paths-ignore:
      - "infra/**"
      - "tests/**"
      - "docs/**"
      - "local/**"
  workflow_dispatch: # Allow manual triggering

# Minimum permissions the official Pages deployment flow requires:
# contents:read for checkout, pages:write to publish, id-token:write for the
# OIDC token deploy-pages uses to prove the deployment's origin.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments. cancel-in-progress is false so an in-flight
# deploy is allowed to finish rather than be left half-applied by a newer run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Reuse eleventy-img's encoded derivatives across runs. The plugin skips
      # the sharp encode when a hashed output already exists in public/img, so a
      # cache hit turns the build warm. The exact key (no restore-keys) makes it
      # all-or-nothing: unchanged inputs hit fully, any change rebuilds clean, so
      # no stale orphan derivatives are ever carried forward. Key on the sources
      # plus anything that changes the output: image options and the plugin
      # version.
      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: public/img
          key: eleventy-img-${{ hashFiles('src/media/images/**', 'eleventy.config.js', 'package-lock.json') }}

      # Run eleventy directly rather than `npm run build`: the build script's
      # prebuild clean wipes public/ and would delete the restored cache. A fresh
      # runner has no stale output to clean, so skipping it is safe here.
      - name: Build site
        env:
          # Ship the RUM bundle, pointed at the same-origin /v1/traces path that
          # Fastly proxies to Honeycomb. No Honeycomb key is present here; it is
          # injected at the edge (see infra/). RUM_MODE also makes head.njk emit
          # the script tag (src/_data/rum.js reads it during the Eleventy build).
          RUM_MODE: production
          RUM_SERVICE_NAME: tollmanz-com-web
          # Optional head-sampling divisor: N exports 1-in-N RUM traces, 1 =
          # 100%. Set the RUM_SAMPLE_RATE repository variable to throttle ingest
          # if traffic or Honeycomb quota demands it. Unset means 100% (the
          # build step falls back to 1).
          RUM_SAMPLE_RATE: ${{ vars.RUM_SAMPLE_RATE }}
        run: |
          node scripts/build-rum.mjs
          npx @11ty/eleventy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Purge Fastly cache
        env:
          FASTLY_PURGE_TOKEN: ${{ secrets.FASTLY_PURGE_TOKEN }}
          FASTLY_SERVICE_ID: ${{ vars.FASTLY_SERVICE_ID }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Fastly-Key: ${FASTLY_PURGE_TOKEN}" \
            --header "Accept: application/json" \
            "https://api.fastly.com/service/${FASTLY_SERVICE_ID}/purge_all"
