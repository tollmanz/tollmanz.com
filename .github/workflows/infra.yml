name: Fastly infra (Pulumi)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  pulumi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      # preview on pull requests, up (apply) on push to main / manual dispatch
      - name: Pulumi ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
        uses: pulumi/actions@v7
        with:
          command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
          stack-name: tollmanz-gmail-com/tollmanz-com-infra/prod
          work-dir: infra
          pulumi-version: 3.246.0
          comment-on-pr: true
        env:
          # pulumi/actions runs on Node 24 and bundles got@11 -> cacheable-request,
          # which calls the deprecated url.parse() and triggers DEP0169. The call
          # is in third-party code, so silence only that one warning. Remove once
          # pulumi/actions#1429 (bump got 11 -> 15, dropping the url.parse call)
          # ships in a release: https://github.com/pulumi/actions/pull/1429
          NODE_OPTIONS: --disable-warning=DEP0169
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          FASTLY_API_KEY: ${{ secrets.FASTLY_API_KEY }}
