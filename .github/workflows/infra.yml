name: Fastly infra (Pulumi)

# Previews (on pull requests) and applies (on push to main / manual dispatch)
# the Pulumi stack that manages the Fastly service. See infra/fastly/.

on:
  push:
    branches: [main]
    paths: &fastly-paths
      - "infra/fastly/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths: *fastly-paths
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Serialize Pulumi runs so a preview never interleaves with an in-flight up.
# cancel-in-progress is false so an apply is allowed to finish rather than be
# left half-applied by a newer run.
concurrency:
  group: pulumi-fastly
  cancel-in-progress: false

jobs:
  pulumi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/fastly
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: infra/fastly/package-lock.json

      - name: Install dependencies
        run: npm ci

      # preview on pull requests, up (apply) on push to main / manual dispatch
      - name: Pulumi ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
        uses: pulumi/actions@v7
        with:
          command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
          stack-name: tollmanz-gmail-com/tollmanz-com-infra/prod
          work-dir: infra/fastly
          pulumi-version: 3.246.0
          comment-on-pr: true
        env:
          # pulumi/actions runs on Node 24 and bundles got@11 -> cacheable-request,
          # which calls the deprecated url.parse() and triggers DEP0169. The call
          # is in third-party code, so silence only that one warning. Remove once
          # pulumi/actions#1429 (bump got 11 -> 15, dropping the url.parse call)
          # ships in a release: https://github.com/pulumi/actions/pull/1429
          NODE_OPTIONS: --disable-warning=DEP0169
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          FASTLY_API_KEY: ${{ secrets.FASTLY_API_KEY }}
